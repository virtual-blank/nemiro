services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_NAME:-nemiro_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" 

  api:
    build: 
      context: ./backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    command: >
      sh -c "alembic upgrade head && 
             uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
  ws-server:
    build:
      context: ./ws-server
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - rabbitmq
    
  worker:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      - postgres
      - rabbitmq
    command: celery -A core.celery_app worker --loglevel=info

volumes:
  postgres_data: